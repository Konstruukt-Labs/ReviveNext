name: Release

# Build the installer and publish a GitHub release on every push (commit
# or merge) to main. Also runnable manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022  # not windows-latest: the VS 2026 image drops
                           # ATL (revive needs atlbase.h) and its v145
                           # toolset mismatches vcpkg-built libs (see the
                           # v143 bump in the revive vcxprojs)
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodules fetched blob-filtered below - the pinned commits only
          # need headers/libs (~13MB of openvr's ~500MB working tree), and a
          # full recursive clone would pull all 403MB of unused samples/
          # (slow to materialize on Windows runners' filesystems, too).
          submodules: false

      # Blob-filtered fetch downloads each submodule's commits/trees plus
      # only the blobs the checkout materializes - ~97% less than a full
      # clone, while still landing exactly the pinned SHA (unlike --depth 1,
      # which would miss the openvr pin sitting one commit past the
      # v1.23.7 tag).
      - name: Submodules (blob-filtered)
        shell: pwsh
        run: git submodule update --init --recursive --filter=blob:none

      # The revive solution resolves detours/openxr-loader through vcpkg's
      # MSBuild integration (same as upstream Revive's CI did). The static-CRT
      # fix this repo used to carry as a port patch was upstreamed into vcpkg
      # (ports/openxr-loader/msvc-crt.diff + portfile rewrite), so the runner's
      # bundled vcpkg needs no patching.
      - name: vcpkg integration and dependencies
        shell: pwsh
        run: |
          vcpkg integrate install
          vcpkg install --triplet x64-windows-static detours openxr-loader

      # LibOVR can't be committed (Meta's license); fetch the same public
      # SDK zip upstream Revive's CI used and unpack it into revive/Externals.
      - name: Oculus SDK (LibOVR)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://securecdn.oculus.com/binaries/download/?id=4377593722298679' -OutFile LibOVR.zip
          Expand-Archive LibOVR.zip -DestinationPath revive\Externals

      # NSIS isn't on every runner image (gone from the newer VS 2026
      # windows-latest) - install it explicitly. choco puts makensis in
      # C:\Program Files (x86)\NSIS, which CMakeLists.txt already checks,
      # and GITHUB_PATH covers PATH-based lookups in later steps.
      - name: NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH 'C:\Program Files (x86)\NSIS'

      # CalVer stamp (yyyy.mm.dd, UTC) shared by the exe's version
      # resource, the installer metadata and the release tag. Computed
      # once here so a job that crosses UTC midnight stamps and tags the
      # same date.
      - name: Version stamp
        shell: pwsh
        run: |
          $v = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd')
          Add-Content $env:GITHUB_ENV "REVIVENEXT_VERSION=$v"

      # Builds ReviveNext.exe + Resources via MSBuild, then the NSIS
      # installer target produces build/ReviveNext-Setup.exe (NSIS is
      # installed in the step above). Configure and build are chained with
      # && so a configure failure stops the step instead of cascading into
      # a confusing MSB1009 from the build invocation.
      - name: Build installer
        shell: pwsh
        run: |
          cmake -B build -S . "-DREVIVENEXT_VERSION=$env:REVIVENEXT_VERSION" && cmake --build build --config Release --target installer

      # Releases are tagged with the CalVer stamp the artifacts carry. A
      # same-day re-push appends the run number to the tag so it can't
      # collide with the existing release.
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:REVIVENEXT_VERSION
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { $tag = "$tag.$env:GITHUB_RUN_NUMBER" }
          gh release create $tag build/ReviveNext-Setup.exe `
            --title "ReviveNext $tag" `
            --generate-notes --latest
